{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - {{ factory_name }}</title>
    <link rel="stylesheet" href="{% static 'css/login.css' %}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h2 class="factory-title">{{ factory_name }}</h2>
            <h3 class="login-subtitle">System Login</h3>

            <!-- ভুল পাসওয়ার্ড দিলে মেসেজ দেখানোর অপশন -->
            {% if messages %}
                <div class="messages">
                    {% for message in messages %}
                        <p style="color: red; text-align: center; margin-bottom: 15px; font-weight: bold; font-size: 14px;">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <!-- ফর্ম সাবমিট হওয়ার জন্য method ও action দেওয়া হলো -->
            <form id="loginForm" method="POST" action="{% url 'login' %}">
                {% csrf_token %}
                <div class="input-group">
                    <label for="userId">User ID</label>
                    <input type="text" id="userId" name="username" required autocomplete="off" autofocus>
                </div>

                <div class="input-group">
                    <label for="password">Password</label>
                    <div class="password-wrapper">
                        <input type="password" id="password" name="password" required>
                        <i class="fas fa-eye" id="togglePassword"></i>
                    </div>
                </div>

                <!-- বাটনটি type="submit" করা হলো -->
                <button type="submit" id="loginBtn" class="login-btn">Login</button>
            </form>
        </div>
    </div>

    <script src="{% static 'js/login.js' %}"></script>
</body>
</html>
